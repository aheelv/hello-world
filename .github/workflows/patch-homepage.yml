name: Patch homepage for op entry

on:
  push:
    paths:
      - '.github/homepage-patch.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch homepage and site registry
        run: |
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path('index.html')
          s = p.read_text(encoding='utf-8')
          assert '共 79 个入口' in s
          s = s.replace('共 79 个入口', '共 80 个入口', 1)
          s = s.replace('<a href="#g-teaching">01 教学建设 <span class="n">3</span></a>', '<a href="#g-teaching">01 教学建设 <span class="n">4</span></a>', 1)
          s = s.replace('<span class="pgroup-no">01</span><h2>教学建设</h2><span class="pgroup-count">3 个页面</span>', '<span class="pgroup-no">01</span><h2>教学建设</h2><span class="pgroup-count">4 个页面</span>', 1)

          anchor = '          <span class="path">https://aheelv.github.io/hello-world/xuni/</span>\n        </article>\n      </div>\n    </section>\n    <section class="pgroup" id="g-agents">'
          assert anchor in s, 'homepage card anchor not found'
          card = (
            '          <span class="path">https://aheelv.github.io/hello-world/xuni/</span>\n'
            '        </article>\n'
            '        <article class="pcard has-badge" data-search="运筹学 · 课程知识图谱 186 节点、320 关系的运筹学 7 章课程知识图谱：力导向关系图、层级树、思维导图、全文检索与章节关系矩阵；支持超星 16/15 列文件导入导出，纯静态离线可用。 186 节点 320 关系 超星兼容 op/ 教学建设">\n'
            '          <span class="badge">图谱入口</span>\n'
            '          <h3>运筹学 · 课程知识图谱</h3>\n'
            '          <p class="desc">186 节点、320 关系的运筹学 7 章课程知识图谱：力导向关系图、层级树、思维导图、全文检索与章节关系矩阵；支持超星 16/15 列文件导入导出，纯静态离线可用。</p>\n'
            '          <div class="tags"><span class="tag">186 节点</span><span class="tag">320 关系</span><span class="tag">超星兼容</span></div>\n'
            '          <a class="pbtn" href="op/">打开页面 <span class="arrow">→</span></a>\n'
            '          <span class="path">op/</span>\n'
            '        </article>\n'
            '      </div>\n'
            '    </section>\n'
            '    <section class="pgroup" id="g-agents">'
          )
          s = s.replace(anchor, card, 1)
          p.write_text(s, encoding='utf-8')

          q = pathlib.Path('assets/sites.json')
          t = q.read_text(encoding='utf-8')
          a2 = '      "tags": [\n        "19 个数据模板",\n        "5 种格式",\n        "超星兼容"\n      ]\n    },\n    {\n      "group": "agents",'
          assert a2 in t, 'registry anchor not found'
          item = (
            '      "tags": [\n        "19 个数据模板",\n        "5 种格式",\n        "超星兼容"\n      ]\n    },\n'
            '    {\n'
            '      "group": "teaching",\n'
            '      "groupName": "教学建设",\n'
            '      "name": "运筹学 · 课程知识图谱",\n'
            '      "desc": "186 节点、320 关系的运筹学 7 章课程知识图谱：力导向关系图、层级树、思维导图、全文检索与章节关系矩阵；支持超星 16/15 列文件导入导出，纯静态离线可用。",\n'
            '      "url": "op/",\n'
            '      "rawUrl": "op/",\n'
            '      "tags": [\n        "186 节点",\n        "320 关系",\n        "超星兼容"\n      ]\n    },\n'
            '    {\n      "group": "agents",'
          )
          q.write_text(t.replace(a2, item, 1), encoding='utf-8')
          print('patched')
          PY

      - name: Commit
        run: |
          git config user.name aheelv
          git config user.email aheelv@qq.com
          git add index.html assets/sites.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat(portal): add op knowledge graph entry card"
            git push
          fi
