<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>章节层级树 · 通用课程知识图谱系统</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div id="site-header"></div>
<div class="container">
  <div id="auth-notice"></div>
  <div class="page-head">
    <div class="crumb"><a href="../index.html">登录入口</a> / <a href="index.html">通用系统</a> / 层级树</div>
    <h1>章节层级树 <span class="chip purple">可折叠 · 1—7 级</span></h1>
    <div class="sub">对应超星模板 A—G 列的层级关系。点击节点展开/收起子级；滚轮缩放、拖拽平移。</div>
  </div>

  <div class="card tight" style="margin-bottom:12px">
    <div class="inline-controls">
      <div><label class="field" style="margin:0"><span>章节筛选</span><select id="chapter"></select></label></div>
      <div><label class="field" style="margin:0"><span>关键词定位</span><input type="search" id="kw" placeholder="输入节点名后回车"></label></div>
      <div class="narrow btn-row" style="padding-bottom:2px">
        <button class="btn sm" id="expand">展开全部</button>
        <button class="btn ghost sm" id="collapse">收起到二级</button>
        <button class="btn gray sm" id="reset">复位视图</button>
      </div>
    </div>
  </div>

  <div class="split">
    <div><div id="tree" class="graph-wrap" style="height:620px"></div>
      <div class="muted" style="margin-top:8px" id="tree-info"></div></div>
    <div class="card" id="detail"><div class="empty">点击节点查看属性</div></div>
  </div>
</div>
<div id="site-footer"></div>

<script src="../data/course-kg.js"></script>
<script src="../assets/js/kg-core.js"></script>
<script src="../assets/vendor/d3.min.js"></script>
<script>
KG.init(window.COURSE_KG, '../');
KG.mountHeader({ active: 'app' }); KG.mountFooter(); KG.mountAuthNotice();

document.getElementById('chapter').innerHTML = KG.selectOptions(KG.chapters, '', '全部章节');
var holder = document.getElementById('tree');
var W = holder.clientWidth || 900, H = 620;
var svg = d3.select(holder).append('svg').attr('width', '100%').attr('height', H)
  .attr('viewBox', '0 0 ' + W + ' ' + H);
var gZoom = svg.append('g');
var g = gZoom.append('g');
var zoom = d3.zoom().scaleExtent([.25, 3]).on('zoom', function (e) { gZoom.attr('transform', e.transform); });
svg.call(zoom);
var tip = d3.select(holder).append('div').attr('class', 'graph-tip');
var i = 0, root, treeLayout = d3.tree().nodeSize([25, 205]);

function toTree(chapter) {
  var roots = KG.hierarchy(chapter || null);
  return d3.hierarchy({
    name: chapter || '运筹学（全部 7 章）', node: null,
    children: roots.map(function to(x) {
      return { name: x.node.name, node: x.node, children: x.children.map(to) };
    })
  }, function (d) { return d.children; });
}

function collapseTo(rootNode, level) {
  function walk(d, lv) {
    if (d.children && d.children.length) {
      d._children = d._children || d.children;
      if (lv >= level) { d.children = null; }
      else { d.children = d._children; d.children.forEach(function (c) { walk(c, lv + 1); }); }
    }
  }
  walk(rootNode, 0);
}

function render(animate) {
  var nodes = treeLayout(root);
  var all = nodes.descendants(), links = nodes.links();
  var minX = d3.min(all, function (d) { return d.x; }), maxX = d3.max(all, function (d) { return d.x; });
  var maxY = d3.max(all, function (d) { return d.y; });
  var height = Math.max(H, maxX - minX + 90);
  var width = Math.max(W, maxY + 320);
  svg.attr('viewBox', '0 0 ' + width + ' ' + height);
  g.attr('transform', 'translate(150,' + (30 - minX) + ')');
  // 缩放由用户控制；初始 transform 直接作用于 g，避免与 zoom 冲突：改用 g 内层
  var link = g.selectAll('path.link').data(links, function (d) { return d.target.data.node ? d.target.data.node.id : 'root'; });
  link.enter().append('path').attr('class', 'link').attr('fill', 'none').attr('stroke', '#C8D3E0').attr('stroke-width', 1.5)
    .merge(link).attr('d', d3.linkHorizontal().x(function (d) { return d.y; }).y(function (d) { return d.x; }));
  link.exit().remove();

  var node = g.selectAll('g.node').data(all, function (d) { return d.data.node ? d.data.node.id : 'root'; });
  var enter = node.enter().append('g').attr('class', 'node')
    .attr('transform', function (d) { return 'translate(' + d.y + ',' + d.x + ')'; })
    .on('click', function (event, d) {
      if (d.children) { d._children = d.children; d.children = null; }
      else if (d._children) { d.children = d._children; d._children = null; }
      render(true);
      if (d.data.node) document.getElementById('detail').innerHTML = KG.detailHTML(d.data.node);
    })
    .on('mouseover', function (event, d) {
      var n = d.data.node;
      tip.style('opacity', 1).html('<b>' + KG.esc(d.data.name) + '</b><br><span style="color:#5A6B7B">' +
        (n ? KG.esc(n.type) + ' · 第' + n.level + '级 · ' + KG.esc(n.chapter) : '根节点') + '</span>');
    })
    .on('mousemove', function (event) {
      var r = holder.getBoundingClientRect();
      tip.style('left', Math.min(event.clientX - r.left + 14, r.width - 280) + 'px')
          .style('top', (event.clientY - r.top + 14) + 'px');
    })
    .on('mouseout', function () { tip.style('opacity', 0); });

  enter.append('circle').attr('r', 6);
  enter.append('text').attr('dy', 3.5).attr('x', 12).style('font-size', '11.5px');
  enter.append('text').attr('class', 'fold').attr('dy', 3.5).attr('x', -13).attr('text-anchor', 'middle').style('font-size', '12px');

  var merged = enter.merge(node);
  merged.transition().duration(animate ? 260 : 0).attr('transform', function (d) { return 'translate(' + d.y + ',' + d.x + ')'; });
  merged.select('circle').attr('r', function (d) { return d.data.node ? (d.data.node.type === '知识单元' ? 6.5 : 5) : 8; })
    .attr('fill', function (d) { return d.data.node ? KG.color(d.data.node.chapter) : '#2E5C8A'; })
    .attr('stroke', '#fff').attr('stroke-width', 1.5);
  merged.select('text').text(function (d) {
    var t = d.data.name; return t.length > 22 ? t.slice(0, 21) + '…' : t;
  }).attr('fill', '#22303C');
  merged.select('text.fold').text(function (d) { return d._children ? '+' : (d.children ? '−' : ''); })
    .attr('fill', '#2E5C8A').style('font-weight', '700');
  node.exit().remove();

  document.getElementById('tree-info').textContent =
    '当前展开 ' + all.length + ' 个节点；共 ' + KG.data.nodes.length + ' 个节点可展开（含根节点）。';
}

function rebuild(level) {
  root = toTree(document.getElementById('chapter').value);
  root.x0 = 0; root.y0 = 0;
  collapseTo(root, level);
  render(false);
}

document.getElementById('chapter').addEventListener('change', function () { rebuild(2); svg.call(zoom.transform, d3.zoomIdentity); });
document.getElementById('expand').addEventListener('click', function () { rebuild(99); });
document.getElementById('collapse').addEventListener('click', function () { rebuild(2); });
document.getElementById('reset').addEventListener('click', function () { svg.call(zoom.transform, d3.zoomIdentity); });
document.getElementById('kw').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  var q = this.value.trim(); if (!q) return;
  var hit = KG.data.nodes.find(function (n) { return n.name.indexOf(q) >= 0; });
  if (!hit) { KG.toast('未找到该节点'); return; }
  // 展开命中节点的所有祖先
  rebuild(99);
  var target = root.descendants().find(function (d) { return d.data.node && d.data.node.id === hit.id; });
  if (target) {
    var t = d3.zoomIdentity.translate(W / 2 - target.y - 150, H / 2 - target.x + 30).scale(1);
    svg.transition().duration(400).call(zoom.transform, t);
    document.getElementById('detail').innerHTML = KG.detailHTML(hit);
    KG.toast('已定位：' + hit.name);
  }
});

rebuild(2);
</script>
</body>
</html>
