<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识点检索 · 通用课程知识图谱系统</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div id="site-header"></div>
<div class="container">
  <div id="auth-notice"></div>
  <div class="page-head">
    <div class="crumb"><a href="../index.html">登录入口</a> / <a href="index.html">通用系统</a> / 知识点检索</div>
    <h1>知识点全文检索 <span class="chip green">四属性可查</span></h1>
    <div class="sub">检索范围覆盖节点名称、描述、专业素养、应用能力、知识点分类、标签与章节；结果可导出 CSV。</div>
  </div>

  <div class="card tight" style="margin-bottom:14px">
    <div class="inline-controls">
      <div style="flex:2 1 260px"><label class="field" style="margin:0"><span>关键词</span><input type="search" id="q" placeholder="例如：单纯形法 / 脱敏 / 逻辑推理"></label></div>
      <div><label class="field" style="margin:0"><span>章节</span><select id="chapter"></select></label></div>
      <div class="narrow"><label class="field" style="margin:0"><span>类型</span><select id="type"></select></label></div>
      <div class="narrow"><label class="field" style="margin:0"><span>难易</span><select id="diff"></select></label></div>
    </div>
    <div class="btn-row" style="margin-top:10px">
      <span class="chip" id="count">—</span>
      <button class="btn ghost sm" id="clear">清空条件</button>
      <button class="btn gray sm" id="csv">导出当前结果为 CSV</button>
    </div>
  </div>

  <div class="split">
    <div class="card tight"><div class="scroll" style="max-height:700px"><table class="tbl" id="result"></table></div></div>
    <div class="card" id="detail"><div class="empty">点击左侧任一节点查看完整属性</div></div>
  </div>
</div>
<div id="site-footer"></div>

<script src="../data/course-kg.js"></script>
<script src="../assets/js/kg-core.js"></script>
<script>
KG.init(window.COURSE_KG, '../');
KG.mountHeader({ active: 'app' }); KG.mountFooter(); KG.mountAuthNotice();

document.getElementById('chapter').innerHTML = KG.selectOptions(KG.chapters, '', '全部章节');
document.getElementById('type').innerHTML = KG.selectOptions(['知识单元', '知识点'], '', '全部类型');
document.getElementById('diff').innerHTML = KG.selectOptions(['容易', '偏易', '适中', '偏难', '难'], '', '全部难易');
var current = [];

function run() {
  current = KG.search(document.getElementById('q').value, {
    chapter: document.getElementById('chapter').value,
    type: document.getElementById('type').value,
    difficulty: document.getElementById('diff').value
  });
  document.getElementById('count').textContent = '命中 ' + current.length + ' 个节点';
  document.getElementById('result').innerHTML =
    '<thead><tr><th style="width:40px">#</th><th>节点名称</th><th>类型</th><th>章节</th><th>难易</th><th>关系数</th></tr></thead><tbody>' +
    (current.length ? current.map(function (n, i) {
      return '<tr style="cursor:pointer" data-id="' + n.id + '"><td>' + (i + 1) + '</td>' +
        '<td><b>' + KG.esc(n.name) + '</b><div class="muted" style="font-size:11.5px">' +
        KG.esc(n.path.slice(0, -1).join(' › ') || '—') + '</div></td>' +
        '<td><span class="chip ' + (n.type === '知识点' ? 'green' : 'purple') + '">' + n.type + '</span></td>' +
        '<td>' + KG.esc(n.chapter) + '</td><td>' + KG.esc(n.difficulty || '—') + '</td><td>' + n.degree + '</td></tr>';
    }).join('') : '<tr><td colspan="6"><div class="empty">没有匹配结果，试试更短的关键词</div></td></tr>') + '</tbody>';
  KG.qsa('#result tr[data-id]').forEach(function (tr) {
    tr.addEventListener('click', function () {
      document.getElementById('detail').innerHTML = KG.detailHTML(KG.byId[tr.dataset.id]);
      document.getElementById('detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });
}
['q'].forEach(function (id) {
  var t; document.getElementById(id).addEventListener('input', function () { clearTimeout(t); t = setTimeout(run, 200); });
});
['chapter', 'type', 'diff'].forEach(function (id) { document.getElementById(id).addEventListener('change', run); });
document.getElementById('clear').addEventListener('click', function () {
  document.getElementById('q').value = ''; document.getElementById('chapter').value = '';
  document.getElementById('type').value = ''; document.getElementById('diff').value = ''; run();
});
document.getElementById('csv').addEventListener('click', function () {
  var cols = ['id', 'name', 'type', 'level', 'chapter', 'description', 'difficulty', 'keypoint', 'literacy', 'application', 'category', 'degree', 'sourceRow'];
  var esc = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
  var csv = '\uFEFF' + cols.join(',') + '\n' + current.map(function (n) {
    return cols.map(function (c) { return esc(c === 'tags' ? n.tags.join(';') : n[c]); }).join(',');
  }).join('\n');
  KG.download('知识点检索结果.csv', csv, 'text/csv;charset=utf-8');
  KG.toast('已导出 ' + current.length + ' 行');
});
var p = new URLSearchParams(location.search);
if (p.get('q')) document.getElementById('q').value = p.get('q');
run();
</script>
</body>
</html>
